name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -e ".[dev]"
          python -m pip check

      - name: Lint with ruff
        run: |
          python -m ruff check driftflow/ tests/ examples/ scripts/

          python -m ruff format --check driftflow/ tests/ examples/ scripts/
      - name: Type check with mypy
        run: python -m mypy driftflow

      - name: Run test suite with coverage gate
        run: python -m pytest tests/ --cov=driftflow --cov-report=term-missing --cov-fail-under=90 -q

      - name: Audit dependencies for known vulnerabilities
        run: |
          python -m pip install --no-cache-dir pip-audit
          python -m pip install --no-cache-dir -e ".[dev]"
          python -m pip freeze | grep -v -E '(^driftflow|^-e .*#egg=driftflow)' > /tmp/driftflow-audit-requirements.txt
          pip-audit --strict --requirement /tmp/driftflow-audit-requirements.txt

      - name: Run demo smoke test
        run: python examples/demo.py --model GruM --dataset QM9 --solver Euler-Maruyama --use-approximation > /dev/null

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-test, site-quality]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir ".[dev]"

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify built artifacts are importable
        run: |
          python -m pip install --no-cache-dir dist/driftflow-*.whl
          python -c "import driftflow; assert driftflow.__version__ == '2.0.0'; print(driftflow.__version__)"

      - name: Verify sdist is self-contained
        run: |
          ls dist/
          tar -tzf dist/driftflow-*.tar.gz | grep -E "docs|examples|tests|scripts" > /dev/null

  site-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install locked site dependencies
        working-directory: site
        run: npm ci

      - name: Audit site production dependencies
        working-directory: site
        run: npm audit --omit=dev --audit-level=high

      - name: Build site
        working-directory: site
        run: npm run build

  production-inference:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install production runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir ".[production]"

      - name: Build sub-10MB reference checkpoint
        run: python scripts/build_reference_model.py --output-dir artifacts

      - name: Validate manifest, digest, and golden outputs
        run: python scripts/validate_reference_model.py --artifact-dir artifacts

      - name: Run inference benchmark
        run: python scripts/benchmark_reference_model.py --artifact-dir artifacts --iterations 100

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
