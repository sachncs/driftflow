name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -e ".[dev]"

      - name: Lint with ruff
        run: |
          python -m ruff check driftflow/ tests/ examples/

          python -m ruff format --check driftflow/ tests/ examples/
      - name: Type check with mypy
        run: python -m mypy driftflow

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Run demo smoke test
        run: python examples/demo.py --model GruM --dataset QM9 --solver Euler --use-approximation > /dev/null

  build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir ".[dev]"

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify built artifacts are importable
        run: |
          python -m pip install --no-cache-dir dist/driftflow-*.whl
          python -c "import driftflow; assert driftflow.__version__ == '1.0.0'; print(driftflow.__version__)"

      - name: Verify sdist is self-contained
        run: |
          ls dist/
          tar -tzf dist/driftflow-*.tar.gz | grep -E "docs|examples|tests|scripts" > /dev/null

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1